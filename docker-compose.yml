services:
  vite-app:
    build: .
    container_name: ressume_vite
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
  cypress:
    depends_on:
      - vite-app
    image: cypress/included:latest
    container_name: ressume_cypress
    working_dir: /app
    ipc: host
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CYPRESS_BASE_URL=http://vite-app:5173
      - NODE_ENV=development
    command: cypress run
