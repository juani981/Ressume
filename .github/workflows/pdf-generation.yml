name: Generate ATS-Friendly PDF

on:
  push:
    branches:
      - dev
      - main
      - Fullstack
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: |
          npm ci || npm install puppeteer

      - name: Generate PDF
        run: |
          node scripts/generate-pdf.js index.html "assets/pdf/CV-Carrizo,JuanIgnacio.pdf"
          
      - name: Commit and Push generated PDF
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add "assets/pdf/CV-Carrizo,JuanIgnacio.pdf"
          git commit -m "chore: auto-generate ATS-friendly vector PDF [skip ci]" || echo "No changes to commit"
          git push
